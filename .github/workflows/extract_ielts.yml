name: Extract Cambridge IELTS Tests to JSON

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Cambridge Book Number (e.g. 21, 20, 19, 18, 17, 16, 15, or 15-21)"
        required: true
        default: "21"
        type: choice
        options:
          - "21"
          - "20"
          - "19"
          - "18"
          - "17"
          - "16"
          - "15"
          - "15-21"
      test:
        description: "Test Number (1, 2, 3, 4, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "1"
          - "2"
          - "3"
          - "4"
      gemini_api_key:
        description: "Optional Gemini API Key (leaves blank to use repo Secret GEMINI_API_KEY if configured)"
        required: false
        type: string

jobs:
  extract:
    name: Extract IELTS Tests to CD-JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf pymupdf google-genai

      - name: Run Extraction Script
        env:
          GEMINI_API_KEY: ${{ inputs.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: |
          python scripts/extract_ielts.py \
            --base-dir . \
            --output-dir extracted_data \
            --book "${{ inputs.book }}" \
            --test "${{ inputs.test }}"

      - name: Commit and Push Extracted JSON Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add extracted_data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-extracted Cambridge ${{ inputs.book }} Test ${{ inputs.test }} CD-IELTS JSON"
            git push
          fi
