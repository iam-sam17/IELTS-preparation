<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS - Official CD-IELTS Practice Platform</title>
    <!-- Authentic Official IELTS Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#e31837">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="welcome.css">
</head>
<body>
    <main class="dashboard-container">
        <header class="dashboard-header">
            <div style="margin-bottom: 12px;">
                <span style="background: #E31837; color: #ffffff; font-weight: 900; font-size: 20px; padding: 6px 16px; border-radius: 6px; letter-spacing: 1px; display: inline-block; box-shadow: 0 4px 10px rgba(227, 24, 55, 0.3);">IELTS</span>
            </div>
            <h1>Computer-Delivered IELTS Preparation Hub</h1>
            <p class="subtitle">Official Simulation Engine • Cambridge 15–21 Authentic Tests</p>
        </header>

        <section class="config-card">
            <h2>Configure Your Practice</h2>
            
            <form id="test-config-form">
                <div class="form-group">
                    <label for="book-select">Cambridge Source</label>
                    <div class="custom-select">
                        <select id="book-select" name="book">
                            <option value="21" selected>Cambridge IELTS 21 (Latest)</option>
                            <option value="20">Cambridge IELTS 20</option>
                            <option value="19">Cambridge IELTS 19</option>
                            <option value="18">Cambridge IELTS 18</option>
                            <option value="17">Cambridge IELTS 17</option>
                            <option value="16">Cambridge IELTS 16</option>
                            <option value="15">Cambridge IELTS 15</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="test-select">Select Test</label>
                    <div class="custom-select">
                        <select id="test-select" name="test">
                            <option value="1" selected>Test 1</option>
                            <option value="2">Test 2</option>
                            <option value="3">Test 3</option>
                            <option value="4">Test 4</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Practice Mode</label>
                    <div class="mode-selector">
                        <label class="mode-card">
                            <input type="radio" name="mode" value="full" checked>
                            <div class="mode-content">
                                <span class="mode-icon">🎯</span>
                                <span class="mode-title">Full Exam</span>
                                <span class="mode-desc">Complete 3-hour simulation</span>
                            </div>
                        </label>
                        <label class="mode-card">
                            <input type="radio" name="mode" value="reading">
                            <div class="mode-content">
                                <span class="mode-icon">📖</span>
                                <span class="mode-title">Reading</span>
                                <span class="mode-desc">60 mins practice</span>
                            </div>
                        </label>
                        <label class="mode-card">
                            <input type="radio" name="mode" value="listening">
                            <div class="mode-content">
                                <span class="mode-icon">🎧</span>
                                <span class="mode-title">Listening</span>
                                <span class="mode-desc">30 mins practice</span>
                            </div>
                        </label>
                        <label class="mode-card">
                            <input type="radio" name="mode" value="writing">
                            <div class="mode-content">
                                <span class="mode-icon">✍️</span>
                                <span class="mode-title">Writing</span>
                                <span class="mode-desc">60 mins practice</span>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="start-btn glow-effect">
                    <span>Start Practice Session</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </section>
        
        <footer class="dashboard-footer">
            <p>Ensure your JSON data is generated in the <code>extracted_data</code> directory before starting.</p>
        </footer>
    </main>

    <script src="welcome.js"></script>
</body>
</html>
